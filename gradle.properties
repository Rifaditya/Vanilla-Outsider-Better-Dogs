# ==============================================================================
# Vanilla Outsider: Better Dogs — Modern 26.1.2 Multi-Loader Properties
# ==============================================================================

# Memory Baseline & JVM Compiler Daemon
org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC
org.gradle.parallel=true
org.gradle.daemon=false

# Mod Identity & SemVer
mod_name=Vanilla Outsider: Better Dogs
mod_version=5.7.13+26.1.2
maven_group=net.vanillaoutsider
archives_base_name=vanilla-outsider-better-dogs

# Minecraft & Multi-Loader Versions
minecraft_version=26.1.2
fabric_version=0.145.4+26.1.2
fabric_loader_version=0.19.1
neoforge_version=26.1.2.126
dasik_library_version=1.13.0+26.1.2
parchment_minecraft_version=26.1.2
parchment_version=2026.01.22

# Toolchain Plugins & Platforms
architectury_version=3.5-SNAPSHOT
loom_version=1.14-SNAPSHOT
enabled_platforms=fabric,neoforge

# Loom & Java Compatibility Guards
loom.ignoreDependencyLoomVersionValidation=true
fabric.loom.suppressJavaCompatibilityChecks=true
loom.suppressJavaCompatibilityChecks=true
loom.allowMismatchedPlatformVersion=true
