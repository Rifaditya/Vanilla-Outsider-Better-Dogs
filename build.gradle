// Root Multi-Module Build Script: Modern 26.1.2 Architectury Loom Toolchain

plugins {
    id 'architectury-plugin' version "${architectury_version}"
    id 'dev.architectury.loom-no-remap' version "${loom_version}" apply false
    id 'maven-publish'
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom-no-remap'

    loom {
        silentMojangMappingsLicense()
        enableModProvidedJavadoc = false
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

        testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
    }

    test {
        useJUnitPlatform()
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    version = rootProject.mod_version
    group = rootProject.maven_group

    base {
        archivesName = rootProject.archives_base_name
    }

    repositories {
        mavenLocal()
        mavenCentral()
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.parchmentmc.org" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.neoforged.net/releases/" }
        maven { url = "https://maven.terraformersmc.com/releases/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.isxander.dev/releases" }
        maven { url = "https://api.modrinth.com/maven" }
        flatDir {
            dirs "e:/Minecraft Project/minecraft-mod-release-hub/archives/Dasik Library"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    java {
        withSourcesJar()
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}
