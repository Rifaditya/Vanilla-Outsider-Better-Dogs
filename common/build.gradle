// Subproject :common — Universal Domain Logic (Zero Loader Dependencies)

architectury {
    common "fabric", "neoforge"
}

loom {
    accessWidenerPath = file("src/main/resources/vanilla-outsider-better-dogs.accesswidener")
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    implementation "net.dasik.social:dasik-library:${rootProject.dasik_library_version}"

    // Config & Optional GUIs (compileOnly to prevent runtime bloat)
    compileOnly "dev.isxander:yet-another-config-lib:3.9.5+26.2-fabric"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:26.1.154"
    compileOnly "maven.modrinth:jade:26.2.8+fabric"

    // Platform-Independent Unit Testing
    testImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    testImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    testImplementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.1+9d6daa9756"
    testImplementation "net.fabricmc.fabric-api:fabric-permission-api-v1:1.0.0+5f4a394125"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }
}
