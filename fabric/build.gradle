architectury {
    platformSetupLoomIde()
    fabric()
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    modImplementation "net.dasik.social:dasik-library-fabric:${rootProject.dasik_library_version}"
    modCompileOnly "com.terraformersmc:modmenu:11.0.1"
    modCompileOnly("dev.isxander:yet-another-config-lib:3.5.0+1.21-fabric") {
        transitive = false
    }
    modCompileOnly "maven.modrinth:jade:15.3.3+fabric"

    implementation project(path: ':common')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    dependsOn ':common:transformProductionFabric'
    from(zipTree(project(':common').tasks.transformProductionFabric.archiveFile)) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

remapJar {
    archiveClassifier.set('fabric')
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = 'better-dogs-fabric'
            from components.java
        }
    }
}
