architectury {
    platformSetupLoomIde()
    fabric()
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    modImplementation "net.dasik.social:dasik-library-fabric:${rootProject.dasik_library_version}"
    modCompileOnly "com.terraformersmc:modmenu:7.2.2"
    modCompileOnly("dev.isxander.yacl:yet-another-config-lib-fabric:3.2.1+1.20") {
        transitive = false
    }
    modCompileOnly "maven.modrinth:jade:11.12.3+fabric"

    implementation project(path: ':common')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

jar {
    dependsOn ':common:transformProductionFabric'
    from(zipTree(project(':common').tasks.transformProductionFabric.archiveFile)) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

remapJar {
    archiveClassifier.set('fabric')
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = 'better-dogs-fabric'
            from components.java
        }
    }
}

afterEvaluate {
    def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
    if (targetJarTask != null) {
        def archiveTask = tasks.register('archiveReleaseJar') {
            group = 'build'
            description = 'Copies built release JAR to external vault when mounted'
            dependsOn targetJarTask
            doLast {
                def jarFile = targetJarTask.archiveFile.get().asFile
                if (jarFile.exists() && file("D:/Minecraft Mod Archive Jars").exists()) {
                    def fnLower = jarFile.name.toLowerCase()
                    if (!fnLower.endsWith("-dev.jar") && !fnLower.endsWith("-sources.jar") && !fnLower.endsWith("-common.jar") && !fnLower.endsWith("-all.jar") && !fnLower.endsWith("-javadoc.jar")) {
                        def vaultDir = file("D:/Minecraft Mod Archive Jars/Better Dogs")
                        vaultDir.mkdirs()
                        copy {
                            from jarFile
                            into vaultDir
                        }
                        println "[DEPLOY-POINT-3] Copied ${jarFile.name} to external vault: ${vaultDir.canonicalPath}"
                    }
                }
            }
        }
        tasks.named('build').configure {
            finalizedBy(archiveTask)
        }
    }
}
