// Subproject :fabric — Fabric Loader Entrypoints & Hooks

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.1+9d6daa9756"

    implementation "net.dasik.social:dasik-library:${rootProject.dasik_library_version}"

    // Optional Integrations
    compileOnly "com.terraformersmc:modmenu:18.0.0-beta.1"
    runtimeOnly "com.terraformersmc:modmenu:18.0.0-beta.1"
    compileOnly "dev.isxander:yet-another-config-lib:3.9.5+26.2-fabric"
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:26.1.154"
    compileOnly "maven.modrinth:jade:26.2.8+fabric"

    // Compile against common classes
    implementation project(path: ':common')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'loader_version', rootProject.fabric_loader_version
    inputs.property 'minecraft_version', rootProject.minecraft_version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'loader_version': rootProject.fabric_loader_version,
               'minecraft_version': rootProject.minecraft_version
    }
}

// Native zipTree Bundling without Shadow plugin (Gradle 9.3+ safe)
jar {
    archiveClassifier.set('fabric')
    dependsOn ':common:transformProductionFabric'
    from(zipTree(project(':common').tasks.transformProductionFabric.archiveFile)) {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = "${rootProject.archives_base_name}-fabric"
            from components.java
        }
    }
}

afterEvaluate {
    def targetJarTask = tasks.findByName('remapJar') ?: tasks.findByName('jar')
    if (targetJarTask != null) {
        def archiveTask = tasks.register('archiveReleaseJar') {
            group = 'build'
            description = 'Copies built release JAR to external vault when mounted'
            dependsOn targetJarTask
            doLast {
                def jarFile = targetJarTask.archiveFile.get().asFile
                if (jarFile.exists() && file("D:/Minecraft Mod Archive Jars").exists()) {
                    def fnLower = jarFile.name.toLowerCase()
                    if (!fnLower.endsWith("-dev.jar") && !fnLower.endsWith("-sources.jar") && !fnLower.endsWith("-common.jar") && !fnLower.endsWith("-all.jar") && !fnLower.endsWith("-javadoc.jar")) {
                        def vaultDir = file("D:/Minecraft Mod Archive Jars/Better Dogs")
                        vaultDir.mkdirs()
                        copy {
                            from jarFile
                            into vaultDir
                        }
                        println "[DEPLOY-POINT-3] Copied ${jarFile.name} to external vault: ${vaultDir.canonicalPath}"
                    }
                }
            }
        }
        tasks.named('build').configure {
            finalizedBy(archiveTask)
        }
    }
}
